<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Esercizio Finale.css">
    <title>Esercizio Finale</title>
</head>

<body>
    <h1 class="title">Pokemon Dashboard</h1>


    <div class="content">
        <div id="loading">Caricamento Pokemon...</div>
        <div class="table-wrapper">
            <table id="pokemonTable">
                <thead>
                    <tr>
                        <th>Immagine</th>
                        <th>Nome</th>
                        <th>ID</th>
                        <th>Tipi</th>
                        <th>Altezza</th>
                        <th>Peso</th>
                    </tr>
                </thead>
                <tbody id="pokemonTableBody"></tbody>
            </table>
            <div id="detailPanel"></div>
        </div>
    </div>

    <div id="pagination">
        <div id="pageInfo"></div>
    </div>


    <div class="controls">
        <button class="btnPag1" onclick="loadPokemon(0)">Prima Pagina</button>
        <button class="prevBtn" onclick="loadPokemon(currentOffset - 40)">Precedente</button>
        <button class="nextBtn" onclick="loadPokemon(currentOffset + 40)">Successivo</button>
        <button class="homeBtn">
            <a href="/index.html">Home Page</a>
        </button>
    </div>

    <div style="display: none;" id="menuDetails" class="details-panel open">
    </div>
    <script src="Esercizio Finale.js"></script>

</body>

</html>
