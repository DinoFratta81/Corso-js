<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizi</title>

    <style>
        .defaultBox {
            width: 150px;
            height: 150px;
            background: gray;
        }

        .highlightBox {
            background: yellow;
            border: 3px solid black;
        }
    </style>
</head>

<body>


    <script type="module" src="Esercizi.js"></script>

    <h1 id="titolo">Ciao Hanna!</h1>

    <p id="messaggio">Testo iniziale</p>

    <div id="contenitore"></div>

    <button id="btn">Cliccami</button>
    <p id="output">Testo originale</p>

    <ul id="lista"></ul>
    <button id="add">Aggiungi elemento</button>
    <input id="nome" placeholder="Scrivi qualcosa">
    <button id="stampa">Stampa</button>
    <p id="risultato"></p>

    <button id="btn1">Cliccami</button>
    <p id="out1">Nessun click ancora</p>

    <button id="btn2">Cliccami 2</button>
    <p id="out2">Nessun click ancora</p>

    <button id="switchBtn">Toggle</button>
    <p id="display">Listener attivo all'inizio</p>


    <button id="toggleBoxBtn">Mostra/Nascondi</button>
    <div id="colorBox" style="width:150px; height:150px; background:blue;"></div><br>

    <button id="colorCycleBtn">Cambia colore</button>
    <div id="colorSquare" style="width:150px; height:150px; background:gray;"></div><br>


    <input id="userText" placeholder="Scrivi qualcosa">
    <button id="updateBtn">Aggiorna</button>
    <p id="resultText">Testo iniziale</p>
    <hr>


    <button id="styleBtn">Cambia stile</button>
    <div id="box" class="defaultBox"></div>
    <hr>


    <div id="hoverBox" style="width:150px; height:150px; background:lightblue;"></div>
    <p id="hoverText">Passa il mouse sopra il box</p>
    <hr>

    <div id="trackArea" style="width:300px; height:150px; background:lightgray;"></div>
    <p id="coords">Coordinate: x=0, y=0</p>


    <div id="multiBox" style="width:150px; height:150px; background:orange;"></div>
    <p id="multiText">Interagisci col box</p>


    <div id="dragBox" style="
      width:120px; 
      height:120px; 
      background:rgba(57, 204, 31, 0.612); 
      position:absolute; 
      top:50px; 
      left:50px;">
    </div>

    <div id="dropZone" style="
      width:300px; 
      height:200px; 
      background:lightgray; 
      border:2px dashed black;">
    </div>

    <div id="dragItem" style="
      width:80px; 
      height:100px; 
      background:royalblue; 
      position:absolute; 
      top:20px; 
      left:20px;
      text-align: center;
      align-items: center;">
        Muovimi nel rettangolo grigio chiaro!
    </div>
    <hr>


    <div id="playArea" style="
      width:400px;
      height:250px;
      background:#ad3838;
      position:relative;">

        <div id="player" style="
      width:60px;
      height:60px;
      background:orange;
      position:absolute;
      top:20px;
      left:20px;">
        </div>
    </div>




</body>

</html>
